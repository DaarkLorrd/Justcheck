<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST CHECK</title>

<style>
:root{
--black:#0a0a0a;
--white:#f5f5f0;
--accent:#c8b99a;
}

body{
margin:0;
background:var(--black);
color:var(--white);
font-family:sans-serif;
}

/* NAV */
nav{
padding:20px;
display:flex;
justify-content:space-between;
}

button{cursor:pointer}

/* GRID */
.products-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
padding:40px;
}

/* CARD */
.product-card{
position:relative;
background:#0d0d0d;
overflow:hidden;
transition:0.4s;
}

.product-card:hover{
transform:translateY(-8px);
box-shadow:0 30px 60px rgba(0,0,0,0.6);
}

/* IMAGE */
.product-img-wrap{
position:relative;
aspect-ratio:3/4;
overflow:hidden;
}

.product-img-wrap img{
width:100%;
height:100%;
object-fit:cover;
transition:0.8s;
}

.product-card:hover img{
transform:scale(1.08);
}

/* SIZE SELECT */
.quick-sizes{
position:absolute;
bottom:0;
width:100%;
display:flex;
justify-content:center;
gap:6px;
padding:12px;
background:rgba(0,0,0,0.85);
transform:translateY(100%);
transition:0.4s;
}

.product-card:hover .quick-sizes{
transform:translateY(0);
}

.quick-sizes span{
font-size:10px;
padding:6px 10px;
border:1px solid rgba(255,255,255,0.2);
}

.quick-sizes span:hover{
border-color:var(--accent);
color:var(--accent);
}

/* INFO */
.product-info{padding:16px;}
.product-name{font-size:14px;letter-spacing:2px;text-transform:uppercase;}
.product-price{color:var(--accent);}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:300px;
height:100%;
background:#111;
padding:20px;
transform:translateX(100%);
transition:0.3s;
}

.cart.open{transform:translateX(0);}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
}

.modal.open{display:flex;}

.modal-box{
background:#111;
padding:20px;
max-width:400px;
}

/* MOBILE */
@media(max-width:600px){
.products-grid{
grid-template-columns:1fr 1fr;
padding:20px;
}
}
</style>

</head>

<body>

<nav>
<h3>JUST CHECK</h3>
<button onclick="toggleCart()">Cart (<span id="count">0</span>)</button>
</nav>

<div class="products-grid" id="grid"></div>

<!-- CART -->

<div class="cart" id="cart">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<button onclick="checkout()">Checkout (WhatsApp)</button>
</div>

<!-- MODAL -->

<div class="modal" id="modal" onclick="closeModal(event)">
<div class="modal-box">
<h3 id="mName"></h3>
<p id="mPrice"></p>
<div id="mSizes"></div>
<button onclick="addFromModal()">Add to Cart</button>
</div>
</div>

<script>

/* DATA */
const products=[
{id:1,name:'Shirt',price:15000,img:'Just_Check_Shirt_Black.jpg',sizes:['M','L','XL'],category:'shirt'},
{id:2,name:'Hoodie',price:30000,img:'Just_Check_Hoodie__Blue.jpg',sizes:['L','XL'],category:'hoodie'}
];

let cart=[];
let currentProduct=null;
let selectedSize='';

/* FORMAT */
function ₦(p){return '₦'+p.toLocaleString();}

/* RENDER */
function render(){
document.getElementById('grid').innerHTML=products.map(p=>`
<div class="product-card">
<div class="product-img-wrap">
<img src="${p.img}">
<div class="quick-sizes">
${p.sizes.map(s=>`<span onclick="addQuick(${p.id},'${s}')">${s}</span>`).join('')}
</div>
</div>
<div class="product-info">
<div class="product-name">${p.name}</div>
<div class="product-price">${₦(p.price)}</div>
<button onclick="openModal(${p.id})">View</button>
</div>
</div>
`).join('');
}

/* QUICK ADD */
function addQuick(id,size){
const p=products.find(x=>x.id===id);
cart.push({p,size});
updateCart();
}

/* MODAL */
function openModal(id){
const p=products.find(x=>x.id===id);
currentProduct=p;
selectedSize=p.sizes[0];

document.getElementById('modal').classList.add('open');
document.getElementById('mName').innerText=p.name;
document.getElementById('mPrice').innerText=₦(p.price);

document.getElementById('mSizes').innerHTML=
p.sizes.map(s=>`<button onclick="selectSize('${s}')">${s}</button>`).join('');
}

function closeModal(e){
if(e.target.id==='modal') document.getElementById('modal').classList.remove('open');
}

function selectSize(s){selectedSize=s;}

function addFromModal(){
cart.push({p:currentProduct,size:selectedSize});
updateCart();
document.getElementById('modal').classList.remove('open');
}

/* CART */
function updateCart(){
document.getElementById('count').innerText=cart.length;
document.getElementById('cartItems').innerHTML=
cart.map(i=>`<p>${i.p.name} (${i.size})</p>`).join('');
}

function toggleCart(){
document.getElementById('cart').classList.toggle('open');
}

/* CHECKOUT */
function checkout(){
let msg='Hello Just Check 👋\n\nOrder:\n';
cart.forEach(i=>{
msg+=`${i.p.name} (${i.size}) - ${₦(i.p.price)}\n`;
});
window.open(`https://wa.me/2347082448928?text=${encodeURIComponent(msg)}`);
}

/* INIT */
render();

</script>

</body>
</html>
