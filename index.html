<style>
/* PREMIUM PRODUCT GRID */
.products-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.product-card {
  position:relative;
  background:#0d0d0d;
  overflow:hidden;
  transition:all 0.45s cubic-bezier(0.25,0.46,0.45,0.94);
}

.product-card:hover {
  transform:translateY(-8px);
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
}

.product-img-wrap {
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
}

.product-img-wrap img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform 0.8s ease;
}

.product-card:hover img {
  transform:scale(1.08);
}

.product-img-wrap::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.5),transparent 60%);
  opacity:0;
  transition:0.4s;
}

.product-card:hover .product-img-wrap::after {
  opacity:1;
}

/* QUICK SIZE SELECT (ZARA STYLE) */
.quick-sizes {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:6px;
  padding:12px;
  background:rgba(0,0,0,0.85);
  transform:translateY(100%);
  transition:0.4s;
}

.product-card:hover .quick-sizes {
  transform:translateY(0);
}

.quick-sizes span {
  font-size:10px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,0.2);
  cursor:pointer;
}

.quick-sizes span:hover {
  border-color:#c8b99a;
  color:#c8b99a;
}

.product-info {
  padding:16px 14px 20px;
}

.product-name {
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.product-price {
  font-size:14px;
  font-weight:600;
  color:#c8b99a;
}

/* MOBILE FIX */
@media(max-width:600px){
  .products-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .product-name{font-size:13px;}
  .product-price{font-size:13px;}
}
</style>

<script>

/* SIZE-BASED ADD TO CART */
function quickAddWithSize(id,size){
  const p = products.find(x=>x.id===id);
  addToCart(p,size,1);
}

/* REPLACE RENDER FUNCTION PRODUCT CARD PART */
function renderProducts(filter='all'){
  const grid=document.getElementById('productsGrid');
  const filtered = filter==='all'?products:products.filter(p=>p.category===filter);

  grid.innerHTML = filtered.map(p=>`
  <div class="product-card">
    <div class="product-img-wrap">
      <img src="${p.img}" alt="${p.name}">
      <div class="quick-sizes">
        ${p.sizes.map(s=>`<span onclick="quickAddWithSize(${p.id},'${s}')">${s}</span>`).join('')}
      </div>
    </div>

    <div class="product-info">
      <div class="product-name">${p.name}</div>
      <div class="product-price">₦${p.price.toLocaleString()}</div>
    </div>
  </div>
  `).join('');
}

/* IMPROVED CHECKOUT MESSAGE */
function checkoutWA(){
  const { summary, total } = buildOrderSummary();

  const msg = `Hello Just Check 👋\n\nI want to place an order:\n\n${summary}\n\nTOTAL: ₦${total.toLocaleString()}\n\nDelivery Location: __________\n\nPlease confirm availability.`;

  window.open(`https://wa.me/2347082448928?text=${encodeURIComponent(msg)}`,'_blank');
}

</script>
