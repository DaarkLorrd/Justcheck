<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST CHECK — Premium Upgrade</title>

<style>
:root {
  --black:#0a0a0a;
  --white:#f5f5f0;
  --accent:#c8b99a;
}

body{background:var(--black);color:var(--white);font-family:sans-serif;}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:40px;
}

.product-card{
  background:#0d0d0d;
  overflow:hidden;
  transition:0.4s ease;
}

.product-card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.product-img-wrap{
  position:relative;
}

.product-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.6s;
}

.product-card:hover img{
  transform:scale(1.05);
}

.product-img-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.4),transparent);
  opacity:0;
  transition:0.4s;
}

.product-card:hover .product-img-wrap::after{
  opacity:1;
}

.product-info{padding:16px;}
.product-name{font-size:15px;letter-spacing:2px;}
.product-price{color:var(--accent);font-weight:600;}

.quick-sizes{
  display:flex;
  gap:6px;
  justify-content:center;
  padding:10px;
}

.quick-sizes span{
  border:1px solid rgba(255,255,255,0.2);
  padding:6px 10px;
  font-size:10px;
  cursor:pointer;
}

.quick-sizes span:hover{
  border-color:var(--accent);
  color:var(--accent);
}

@media(max-width:600px){
  .products-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="products-grid" id="productsGrid"></div>

<script>
const products=[
{id:1,name:'Shirt',price:15000,img:'https://via.placeholder.com/300',sizes:['M','L','XL']},
{id:2,name:'Hoodie',price:30000,img:'https://via.placeholder.com/300',sizes:['L','XL']}
];

function formatPrice(p){return '₦'+p.toLocaleString();}

function render(){
const grid=document.getElementById('productsGrid');
grid.innerHTML=products.map(p=>`
<div class="product-card">
<div class="product-img-wrap">
<img src="${p.img}">
</div>
<div class="quick-sizes">
${p.sizes.map(s=>`<span onclick="add('${p.name}','${s}')">${s}</span>`).join('')}
</div>
<div class="product-info">
<div class="product-name">${p.name}</div>
<div class="product-price">${formatPrice(p.price)}</div>
</div>
</div>`).join('');
}

function add(name,size){
alert(`${name} (${size}) added`);
}

render();
</script>

</body>
</html>
